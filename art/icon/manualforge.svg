<!-- ManualForge's icon (#67): a manual laid on an anvil, sparks flying. The full drawing, for 40 px and up.
     manualforge-small.svg is the same picture redrawn for 16-32 px. tools/build-icon.ps1 builds AppIcon.ico from both. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3adbc"/><stop offset="1" stop-color="#4b535f"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d7cab"/><stop offset="1" stop-color="#1f4a69"/></linearGradient>
    <radialGradient id="spark" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3c4"/><stop offset=".5" stop-color="#ffc24a"/><stop offset="1" stop-color="#f06a2a"/></radialGradient>
  </defs>
  <!-- the anvil: horn to the left, waist, foot -->
  <path d="M4 30 Q13 31 19 26.5 L60 26.5 L60 33.5 Q50 34.5 46 39 Q43 43 45 48 L50 49 L50 57 L18 57 L18 49 L23 48 Q25 43 22 39 Q19 35.5 12 35 Q6.5 34.2 4 30 Z" fill="url(#iron)"/>
  <path d="M19 26.5 H60 V29.2 H19 Z" fill="#d3dae3" opacity=".8"/>
  <!-- the manual lying on it: back board, page block, front board, spine -->
  <rect x="24" y="22.6" width="31" height="4.4" rx="1.2" fill="#1f4a69"/>
  <rect x="26" y="14.6" width="28" height="8.4" fill="#f7f0e2"/>
  <path d="M26 17.4 H54 M26 20.2 H54" stroke="#cdbd9a" stroke-width=".9"/>
  <rect x="24" y="11" width="31" height="4.2" rx="1.2" fill="url(#cover)"/>
  <path d="M27 11 Q20.5 19 27 27 L29 27 L29 11 Z" fill="#1f4a69"/>
  <!-- sparks -->
  <path d="M13 5 L14.6 9.4 L19 11 L14.6 12.6 L13 17 L11.4 12.6 L7 11 L11.4 9.4 Z" fill="url(#spark)"/>
  <circle cx="6" cy="20" r="1.5" fill="#ffc24a"/>
  <circle cx="21" cy="4" r="1.3" fill="#f27a2e"/>
</svg>
